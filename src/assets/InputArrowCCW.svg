<!-- The turning arrow of a driven joint, alone: the same artwork as
     InputCCW.svg with the case and the ground marks removed, and every
     point pushed 9 units further from the pin it turns about.

     Pushed rather than scaled. A driven pin has the member it turns
     running straight over it, and at the shipped radius the bar covered
     the arrow entirely; scaling the glyph up would have cleared the bar
     by thickening every stroke with it. Moving each point outward by a
     fixed distance leaves the stroke exactly as heavy as it is on a
     grounded joint and only widens the circle it rides. -->
