<nav class="navBar" id="{{ isDevMode() ? 'devModeColor' : '' }}">
  <img
    class="pmksImage"
    alt="PMKS+"
    src="assets/PMKS_logo.png"
    onClick="window.location.reload()"
  />
  <!-- A real handler rather than an onclick attribute. In a DOM attribute
       `this` is the button and `logEvent` is a global that does not exist, so
       every click on New threw an uncaught ReferenceError -- after opening the
       tab, which is why the button looked like it worked. -->
  <button
    mat-button
    (click)="newProject()"
    matTooltip="Open a new tab with a blank project"
    matTooltipShowDelay="1000"
  >
    <mat-icon>note_add</mat-icon>
    New
  </button>
  <input #csvInput style="display: none" type="file" accept="text" (change)="upload($event)" />
  <button
    mat-button
    (click)="csvInput.click()"
    matTooltip="Open a linkage from a file on your device"
    matTooltipShowDelay="1000"
  >
    <mat-icon>file_open</mat-icon>
    Open
  </button>
  <button
    mat-button
    (click)="openTemplates()"
    matTooltip="Show the library of available linkages"
    matTooltipShowDelay="1000"
    id="templatesButton"
  >
    <mat-icon>apps</mat-icon>
    Templates
  </button>
  <button
    mat-button
    (click)="downloadLinkage()"
    matTooltip="Save this linkage to your device"
    matTooltipShowDelay="1000"
  >
    <mat-icon>save</mat-icon>
    Save
  </button>
  <button
    mat-button
    (click)="copyURL()"
    matTooltip="Copy a link to this mechanism to the clipboard"
    matTooltipShowDelay="1000"
  >
    <mat-icon>link</mat-icon>
    Share Project
  </button>
  <div class="spacer"></div>
  @if (isDevMode()) {
    <ng-container
      matTooltip="This message and the debug panel will disappear"
      matTooltipShowDelay="1000"
    >
      <p class="devModeNotice">
        You are in Development Mode. The color will return to normal when you build with the
        production flag.
      </p>
    </ng-container>
  }
  @if (isDevMode()) {
    <button
      mat-button
      (click)="openRightPanelDebug()"
      matTooltip="This button will not show up in prod"
      matTooltipShowDelay="1000"
    >
      <mat-icon>bug_report</mat-icon>
      Debug
    </button>
  }
  <button
    mat-button
    (click)="openRightPanelSettings()"
    matTooltip="Change Linkage Settings"
    matTooltipShowDelay="1000"
  >
    <mat-icon>settings</mat-icon>
    Settings
  </button>
  <button
    mat-button
    (click)="openRightPanelHelp()"
    matTooltip="Get Support from our team"
    matTooltipShowDelay="1000"
    id="helpButton"
  >
    <mat-icon>help</mat-icon>
    Help / Feedback
  </button>
</nav>
