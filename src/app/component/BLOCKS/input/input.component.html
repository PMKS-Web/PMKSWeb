<div id="input-block" [class.stacked]="stacked()">
  <div class="row" [formGroup]="formGroup">
    <span class="label"><ng-content></ng-content></span>
    <mat-icon matTooltip="{{ this.tooltip() }}" matTooltipShowDelay="400" class="label-help">
      help_outline
    </mat-icon>
    <div class="spacer"></div>
    <mat-form-field
      class="customInputForm"
      [class.has-unit]="unit"
      [class.wide]="wide"
      [class.has-unit-select]="hasUnitSelect"
      (click)="field.select()"
      (mouseenter)="setMouseOver(true)"
      (mouseleave)="setMouseOver(false)"
      (focusin)="setFocused(true)"
      (focusout)="setFocused(false)"
    >
      <input
        matInput
        class="customInput"
        spellcheck="false"
        type="text"
        #field
        (keyup.enter)="field.blur()"
        [formControlName]="this._formControl"
      />
      @if (unit) {
        <span matTextSuffix class="input-unit">{{ unit }}</span>
      }
      <!-- Optional projected trailing content — the mass fields hang their
           state dot and clear button here; everyone else projects nothing. -->
      <span matTextSuffix class="field-suffix"><ng-content select="[fieldSuffix]"></ng-content></span>
      @if (hasUnitSelect) {
        <!-- A native select rather than mat-select: mat-select registers itself as
             a form field's control, so nesting one here would displace the input.
             stopPropagation keeps opening it from re-selecting the number. -->
        <select
          matTextSuffix
          class="unit-select"
          [formControlName]="unitFormControl()!"
          (click)="$event.stopPropagation()"
        >
          @for (option of unitOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      }
    </mat-form-field>
  </div>
</div>
